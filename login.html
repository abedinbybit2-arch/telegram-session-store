<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Telegram Session Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <a class="brand" href="/">
        <div class="brand-mark">TS</div>
        <span>Telegram Session Store</span>
      </a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to access your encrypted Telegram session vault.</p>

      <div id="auth-alert" class="auth-alert error" hidden></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="you@company.com"
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          />
        </div>
        <button class="btn primary block" id="btn-submit" type="submit">
          Sign in
        </button>
      </form>

      <p class="auth-footer">
        No account?
        <a href="/signup.html">Create one</a>
      </p>
    </div>

    <script type="module" src="/js/v/protect.js"></script>
    <script type="module" src="/js/v/login.js"></script>
  </body>
</html>
